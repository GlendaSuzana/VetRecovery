<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10251f">
    <title>VetRecovery | Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="img/logo_1.png">
    <style>
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 24px;
      }
      
    </style>
  </head>
  <body>
    <div class="login-wrapper">
      <a class="logo-area" href="index.html" title="Voltar para o início">
             <img src="img/logo_2.png" alt="Logo VetRecovery" style="height: 8rem; margin-bottom: 8px;"> 
      </a>

      <div class="login-card">
        <h1>Acesso ao painel</h1>
        <p>Insira suas credenciais para acompanhar os boxes de recuperação.</p>

        <div id="errorMessage" class="error-msg" role="alert">
          Usuário ou senha incorretos. Tente novamente.
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username">Usuário</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="usuário"
              autocomplete="username"
              required
            >
          </div>

          <div class="form-group">
            <label for="password">Senha</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >
          </div>

          <button type="submit" class="btn-submit">Entrar no monitoramento →</button>
        </form>
      </div>

      <a class="back-link" href="index.html">← Voltar para a página inicial</a>
    </div>

    <script>
      const loginForm = document.getElementById('loginForm');
      const errorMessage = document.getElementById('errorMessage');

      loginForm.addEventListener('submit', function (event) {
        event.preventDefault();

        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;

        const VALID_USER = 'vetrecovery.uema.br';
        const VALID_PASS = 'micro1234';

        if (user === VALID_USER && pass === VALID_PASS) {
          errorMessage.style.display = 'none';
          sessionStorage.setItem('vetrecovery_auth', 'true');
          window.location.href = 'vetrecovery_dashboard.html';
        } else {
          errorMessage.style.display = 'block';
        }
      });
    </script>
  </body>
</html>
